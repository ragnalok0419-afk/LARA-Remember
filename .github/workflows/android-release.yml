name: Build LARA Android installable APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project
        run: python validate_project.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax check
        run: |
          node --check main.js
          python - <<'PYCODE'
          from pathlib import Path
          import re
          page=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>', page, re.S|re.I)
          assert blocks, 'No embedded scripts found'
          Path('/tmp/lara_inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PYCODE
          node --check /tmp/lara_inline.js
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Generate temporary demonstration keystore
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/lara-demo.jks" -alias lara-demo -keyalg RSA -keysize 3072 -validity 365 -storepass demo-only-2026 -keypass demo-only-2026 -dname "CN=LARA Demo,O=Prototype,C=KR"
          echo "LARA_SIGN_STORE=$RUNNER_TEMP/lara-demo.jks" >> "$GITHUB_ENV"
          echo "LARA_SIGN_PASS=demo-only-2026" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Package contest APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/LARA_demo_release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LARA-Android-release-APK
          path: apk/LARA_demo_release.apk
          retention-days: 14
